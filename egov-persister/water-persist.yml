serviceMaps:
  serviceName: ws-services
  mappings:
    - version: 1
      description: Persists Water Service details in eg_ws_connection  table
      fromTopic: save-ws-connection
      isTransaction: true
      queryMaps:
        - query: 
            INSERT INTO eg_ws_connection(id, tenantid, propertyid,
            ispropertyregistered, applicationno, applicationstatus, status,
            connectiontype, connectionno, action, pipesize, createdby,
            createdtime, lastmodifiedby, lastmodifiedtime,usagetype,
            usagesubtype, applicationtype,oldconnectionno,
            connectiondate,isoldconnectionnoexist) VALUES (?, ?, ?, ?, ?, ?, ?,
            ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: WaterConnection
          jsonMaps:
            - jsonPath: $.WaterConnection.id
            - jsonPath: $.WaterConnection.tenantId
            - jsonPath: $.WaterConnection.propertyId
            - jsonPath: $.WaterConnection.isPropertyRegistered
            - jsonPath: $.WaterConnection.applicationNo
            - jsonPath: $.WaterConnection.applicationStatus
            - jsonPath: $.WaterConnection.status
            - jsonPath: $.WaterConnection.connectionType
            - jsonPath: $.WaterConnection.connectionNo
            - jsonPath: $.WaterConnection.processInstance.action
            - jsonPath: $.WaterConnection.pipeSize
            - jsonPath: $.WaterConnection.auditDetails.createdBy
            - jsonPath: $.WaterConnection.auditDetails.createdTime
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedBy
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedTime
            - jsonPath: $.WaterConnection.usageType
            - jsonPath: $.WaterConnection.usageSubType
            - jsonPath: $.WaterConnection.applicationType
            - jsonPath: $.WaterConnection.oldConnectionNo
            - jsonPath: $.WaterConnection.connectionDate
            - jsonPath: $.WaterConnection.isOldConnectionNoExist
        - query: "INSERT INTO eg_ws_connectionholder_address(tenantid, id, wsid, colony, houseno, zone, locality, ward, city, postalcode, propertytype, createdby, createdtime, lastmodifiedby, lastmodifiedtime)\tVALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);"
          basePath: WaterConnection
          jsonMaps:
            - jsonPath: $.WaterConnection.property.tenantId
            - jsonPath: $.WaterConnection.property.id
            - jsonPath: $.WaterConnection.id
            - jsonPath: $.WaterConnection.property.address.street
            - jsonPath: $.WaterConnection.property.address.doorNo
            - jsonPath: $.WaterConnection.property.address.zone
            - jsonPath: $.WaterConnection.property.address.locality.name
            - jsonPath: $.WaterConnection.property.address.ward
            - jsonPath: $.WaterConnection.property.address.city
            - jsonPath: $.WaterConnection.property.address.pincode
            - jsonPath: $.WaterConnection.property.propertyType
            - jsonPath: $.WaterConnection.auditDetails.createdBy
            - jsonPath: $.WaterConnection.auditDetails.createdTime
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedBy
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedTime
        - query: 
            INSERT INTO eg_ws_connectionholder(id, connectionholderaddressid,
            tenantid, propertyid, ownername, ownernameinhindi, mobilenumber,
            alternatemobilenumber, gender, email, fatherorhusbandname,
            relationship, photoidtype, photoid, useruuid, isprimaryowner,
            createdby, createdtime, lastmodifiedby, lastmodifiedtime) VALUES (?,
            ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: WaterConnection.connectionHolders.*
          jsonMaps:
            - jsonPath: $.WaterConnection.connectionHolders.*.ids
            - jsonPath: $.WaterConnection.connectionHolders.*.conHolderAddressId
            - jsonPath: $.WaterConnection.connectionHolders.*.tenantId
            - jsonPath: $.WaterConnection.property.propertyId
            - jsonPath: $.WaterConnection.connectionHolders.*.name
            - jsonPath: $.WaterConnection.connectionHolders.*.hindiName
            - jsonPath: $.WaterConnection.connectionHolders.*.mobileNumber
            - jsonPath: $.WaterConnection.connectionHolders.*.altContactNumber
            - jsonPath: $.WaterConnection.connectionHolders.*.gender
            - jsonPath: $.WaterConnection.connectionHolders.*.emailId
            - jsonPath: $.WaterConnection.connectionHolders.*.fatherOrHusbandName
            - jsonPath: $.WaterConnection.connectionHolders.*.relationship
            - jsonPath: $.WaterConnection.connectionHolders.*.identityType.identityType
            - jsonPath: 
                $.WaterConnection.connectionHolders.*.identityType.identityNumber
            - jsonPath: $.WaterConnection.connectionHolders.*.uuid
            - jsonPath: $.WaterConnection.connectionHolders.*.isPrimaryOwner
            - jsonPath: $.WaterConnection.auditDetails.createdBy
            - jsonPath: $.WaterConnection.auditDetails.createdTime
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedBy
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedTime
        - query: 
            INSERT INTO eg_ws_applicationdocument(id, tenantid, status,
            documenttype, filestoreid, wsid,  documentuid, createdby,
            createdtime, lastmodifiedby, lastmodifiedtime) VALUES (?, ?, ?, ?,
            ?, ?, ?, ?, ?, ?, ?);
          basePath: WaterConnection.documents.*
          jsonMaps:
            - jsonPath: $.WaterConnection.documents.*.id
            - jsonPath: $.WaterConnection.documents.*.tenantId
            - jsonPath: $.WaterConnection.documents.*.status
            - jsonPath: $.WaterConnection.documents.*.documentType
            - jsonPath: $.WaterConnection.documents.*.fileStoreId
            - jsonPath: $.WaterConnection.documents.*.connectionId
            - jsonPath: $.WaterConnection.documents.*.documentUid
            - jsonPath: $.WaterConnection.documents.*.auditDetails.createdBy
            - jsonPath: $.WaterConnection.documents.*.auditDetails.createdTime
            - jsonPath: $.WaterConnection.documents.*.auditDetails.lastModifiedBy
            - jsonPath: $.WaterConnection.documents.*.auditDetails.lastModifiedTime
    - version: 1
      description: 
        Workflow status update Persists Water Service details in
        eg_ws_connection  table
      fromTopic: update-ws-workflow
      isTransaction: true
      queryMaps:
        - query: 
            UPDATE eg_ws_connection set
            applicationstatus=?,status=?,connectionno=?,connectiondate=?,disconnectiondate=?,action=?,lastmodifiedby=?,
            lastmodifiedtime=? WHERE tenantid=? and applicationno=?;
          basePath: WaterConnection
          jsonMaps:
            - jsonPath: $.WaterConnection.applicationStatus
            - jsonPath: $.WaterConnection.status
            - jsonPath: $.WaterConnection.connectionNo
            - jsonPath: $.WaterConnection.connectionDate
            - jsonPath: $.WaterConnection.disConnectionDate
            - jsonPath: $.WaterConnection.processInstance.action
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedBy
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedTime
            - jsonPath: $.WaterConnection.tenantId
            - jsonPath: $.WaterConnection.applicationNo
        - query: 
            UPDATE eg_ws_connection set disconnectiondate=?,lastmodifiedby=?,
            lastmodifiedtime=? WHERE tenantid=? and connectionno=?;
          basePath: WaterConnection
          jsonMaps:
            - jsonPath: $.WaterConnection.disConnectionDate
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedBy
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedTime
            - jsonPath: $.WaterConnection.tenantId
            - jsonPath: $.WaterConnection.connectionNo
    - version: 1
      description: update Persists Water Service details in eg_ws_connection  table
      fromTopic: update-ws-connection
      isTransaction: true
      queryMaps:
        - query: 
            UPDATE eg_ws_connection SET connectiontype=?, pipesize=?,
            lastmodifiedby=?, lastmodifiedtime=?,usagetype=?, usagesubtype=?,
            applicationtype=? WHERE tenantid=? and applicationno=?;
          basePath: WaterConnection
          jsonMaps:
            - jsonPath: $.WaterConnection.connectionType
            - jsonPath: $.WaterConnection.pipeSize
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedBy
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedTime
            - jsonPath: $.WaterConnection.usageType
            - jsonPath: $.WaterConnection.usageSubType
            - jsonPath: $.WaterConnection.applicationType
            - jsonPath: $.WaterConnection.tenantId
            - jsonPath: $.WaterConnection.applicationNo
        - query: 
            UPDATE eg_ws_connectionholder_address SET colony=?, houseno=?,
            zone=?, locality=?, ward=?, city=?, postalcode=?, propertytype=?,
            lastmodifiedby=?, lastmodifiedtime=? WHERE tenantid=? and wsid=?;
          basePath: WaterConnection
          jsonMaps:
            - jsonPath: $.WaterConnection.property.address.locality.name
            - jsonPath: $.WaterConnection.property.address.doorNo
            - jsonPath: $.WaterConnection.property.address.zone
            - jsonPath: $.WaterConnection.property.address.locality.name
            - jsonPath: $.WaterConnection.property.address.ward
            - jsonPath: $.WaterConnection.property.address.city
            - jsonPath: $.WaterConnection.property.address.pincode
            - jsonPath: $.WaterConnection.property.propertyType
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedBy
            - jsonPath: $.WaterConnection.auditDetails.lastModifiedTime
            - jsonPath: $.WaterConnection.tenantId
            - jsonPath: $.WaterConnection.id
        - query: 
            INSERT INTO eg_ws_applicationdocument(id, tenantid, documenttype,
            filestoreid, wsid, status, documentuid, createdby, createdtime,
            lastmodifiedby, lastmodifiedtime) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?,
            ?, ?) ON CONFLICT (tenantid,wsid,documenttype) DO UPDATE SET
            filestoreid=?, status=?, documentuid=?, lastmodifiedby=?,
            lastmodifiedtime=?;
          basePath: WaterConnection.documents.*
          jsonMaps:
            - jsonPath: $.WaterConnection.documents.*.id
            - jsonPath: $.WaterConnection.documents.*.tenantId
            - jsonPath: $.WaterConnection.documents.*.documentType
            - jsonPath: $.WaterConnection.documents.*.fileStoreId
            - jsonPath: $.WaterConnection.documents.*.connectionId
            - jsonPath: $.WaterConnection.documents.*.status
            - jsonPath: $.WaterConnection.documents.*.documentUid
            - jsonPath: $.WaterConnection.documents.*.auditDetails.createdBy
            - jsonPath: $.WaterConnection.documents.*.auditDetails.createdTime
            - jsonPath: $.WaterConnection.documents.*.auditDetails.lastModifiedBy
            - jsonPath: $.WaterConnection.documents.*.auditDetails.lastModifiedTime
            - jsonPath: $.WaterConnection.documents.*.fileStoreId
            - jsonPath: $.WaterConnection.documents.*.status
            - jsonPath: $.WaterConnection.documents.*.documentUid
            - jsonPath: $.WaterConnection.documents.*.auditDetails.lastModifiedBy
            - jsonPath: $.WaterConnection.documents.*.auditDetails.lastModifiedTime
        - query: 
            INSERT INTO eg_ws_connection_charges(id, tenantid, wsid,
            newconnectioncharges, monthlycharges, servicecharges, othercharges,
            isactive, createdby, createdtime, lastmodifiedby, lastmodifiedtime)
            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: WaterConnection
          jsonMaps:
            - jsonPath: $.WaterConnection.connectionCharges.id
            - jsonPath: $.WaterConnection.connectionCharges.tenantId
            - jsonPath: $.WaterConnection.connectionCharges.wsconnectionId
            - jsonPath: $.WaterConnection.connectionCharges.newConnectionCharges
            - jsonPath: $.WaterConnection.connectionCharges.monthlyCharges
            - jsonPath: $.WaterConnection.connectionCharges.serviceCharges
            - jsonPath: $.WaterConnection.connectionCharges.otherCharges
            - jsonPath: $.WaterConnection.connectionCharges.isActive
            - jsonPath: $.WaterConnection.connectionCharges.auditDetails.createdBy
            - jsonPath: $.WaterConnection.connectionCharges.auditDetails.createdTime
            - jsonPath: $.WaterConnection.connectionCharges.auditDetails.lastModifiedBy
            - jsonPath: 
                $.WaterConnection.connectionCharges.auditDetails.lastModifiedTime
        - query: 
            delete from eg_ws_connection_plumbings where applicationno=?;
          basePath: WaterConnection
          jsonMaps:
            - jsonPath: $.WaterConnection.applicationNo
        - query: 
            INSERT INTO eg_ws_connection_plumbings(id, applicationno, materialCode,
            requestedquantity, createdby, createdtime, lastmodifiedby, lastmodifiedtime)
            VALUES (?, ?, ?, ?, ?, ?, ?, ?);
          basePath: WaterConnection
          jsonMaps:
            - jsonPath: $.WaterConnection.plumbingDetails.*.id
            - jsonPath: $.WaterConnection.applicationNo
            - jsonPath: $.WaterConnection.plumbingDetails.*.materialDetails.code
            - jsonPath: $.WaterConnection.plumbingDetails.*.requestedQuantity
            - jsonPath: $.WaterConnection.plumbingDetails.*.auditDetails.createdBy
            - jsonPath: $.WaterConnection.plumbingDetails.*.auditDetails.createdTime
            - jsonPath: $.WaterConnection.plumbingDetails.*.auditDetails.lastModifiedBy
            - jsonPath: $.WaterConnection.plumbingDetails.*.auditDetails.lastModifiedTime