ServiceMaps:
 serviceName: Collection Services
 version: 1.0.0
 mappings:
  - topic: egov.collection.payment-create
    configKey: INDEX
    indexes:
      - name: paymentsindex-v1
        type: payments
        id: $.id
        jsonPath: $.Payment
        isBulk: false
        timeStampField: $.auditDetails.createdTime 
        customJsonMapping:
          indexMapping: {"tenantId":"","id":"","transactionNumber":"","transactionDate":1,"paymentMode":"","paymentStatus":"","payerId":"","payerName":"","paidBy":"","paymentDetails":{},"auditDetails":{},"additionalDetails":{},"tenantData":{},"@timestamp":"timestamp"}
          fieldMapping:
          - inJsonPath: $.tenantId
            outJsonPath: $.tenantId
          - inJsonPath: $.id
            outJsonPath: $.id
          - inJsonPath: $.transactionNumber
            outJsonPath: $.transactionNumber
          - inJsonPath: $.transactionDate
            outJsonPath: $.transactionDate
          - inJsonPath: $.paymentMode
            outJsonPath: $.paymentMode
          - inJsonPath: $.paymentStatus
            outJsonPath: $.paymentStatus	
          - inJsonPath: $.payerId
            outJsonPath: $.payerId
          - inJsonPath: $.payerName
            outJsonPath: $.payerName
          - inJsonPath: $.paidBy
            outJsonPath: $.paidBy
          - inJsonPath: $.paymentDetails
            outJsonPath: $.paymentDetails
          - inJsonPath: $.auditDetails
            outJsonPath: $.auditDetails
          - inJsonPath: $.additionalDetails
            outJsonPath: $.additionalDetails
          - inJsonPath: $.@timestamp
            outJsonPath: $.@timestamp
          mdmsMapping:
          - path: http://egov-mdms-service.egov:8080/egov-mdms-service/v1/_search
            moduleName: tenant
            masterName: tenants
            tenantId: mp
            filter: "[?(@.code == $tenant)]"
            filterMapping:
            - variable: $tenant
              valueJsonpath: $.tenantId
            uriResponseMapping:
            - inJsonPath: $.MdmsRes.tenant.tenants
              outJsonPath: $.tenantData
            
